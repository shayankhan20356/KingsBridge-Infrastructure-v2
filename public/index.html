<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KING'S BRIDGE: Advanced Technology Consultancy specializing in Agentic AI, Penetration Testing, and Enterprise Infrastructure.">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>KING'S BRIDGE | Advanced Technology Consultancy</title>
    <style>
        /* Ambient Pure Black Background Glows */
        .blue-glow {
            box-shadow: 0 0 50px -10px rgba(56, 189, 248, 0.25);
        }
        .gold-border-glow:hover {
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.35);
            border-color: rgba(212, 175, 55, 0.8) !important;
        }
        .blue-border-glow:hover {
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.35);
            border-color: rgba(56, 189, 248, 0.8) !important;
        }
        .gold-text-gradient {
            background: linear-gradient(135deg, #FFFFFF 0%, #FEF08A 40%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .blue-text-gradient {
            background: linear-gradient(135deg, #FFFFFF 0%, #BAE6FD 40%, #38BDF8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Interactive Contact Card & Input Hover Effects */
        .contact-card-hover {
            transition: all 0.5s ease-in-out;
            border: 1px solid rgba(38, 38, 38, 1);
        }
        .contact-card-hover:hover {
            border-color: rgba(56, 189, 248, 0.6) !important;
            box-shadow: 0 0 45px rgba(56, 189, 248, 0.2), inset 0 0 20px rgba(212, 175, 55, 0.05);
        }
        .input-hover {
            transition: all 0.3s ease;
        }
        .input-hover:hover {
            border-color: rgba(212, 175, 55, 0.6) !important;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }
    </style>
</head>
<body class="bg-black text-slate-100 font-sans antialiased selection:bg-amber-400 selection:text-black">

    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[500px] bg-sky-500/20 blur-[170px] pointer-events-none rounded-full -z-10"></div>
    <div class="fixed top-1/3 right-0 w-[600px] h-[600px] bg-amber-500/10 blur-[190px] pointer-events-none rounded-full -z-10"></div>
    <div class="fixed bottom-0 left-0 w-[700px] h-[500px] bg-blue-600/15 blur-[180px] pointer-events-none rounded-full -z-10"></div>

    <nav class="sticky top-0 z-50 backdrop-blur-2xl bg-black/90 border-b border-neutral-900 px-8 py-5 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-2.5 h-2.5 bg-amber-400 rounded-full animate-pulse shadow-[0_0_12px_#d4af37]"></div>
            <h1 class="text-xl font-extrabold tracking-[0.25em] gold-text-gradient">
                KING'S BRIDGE
            </h1>
        </div>
        <div class="hidden md:flex space-x-8 text-xs font-semibold uppercase tracking-[0.2em] text-neutral-400">
            <a href="#services" class="hover:text-amber-300 transition-colors">Expertise</a>
            <a href="#projects" class="hover:text-sky-400 transition-colors">Deployments</a>
            <a href="#leadership" class="hover:text-amber-300 transition-colors">Structure</a>
            <a href="#contact" class="hover:text-sky-400 transition-colors">Contact</a>
        </div>
    </nav>
    
    <div id="hero-module"></div>
    <div id="services-module"></div>
    <div id="tech-module"></div>
    <div id="projects-module"></div>
    <div id="leadership-module"></div>
    <div id="cta-module"></div>
    <div id="contact-module"></div>
    <div id="footer-module"></div>

    <script src="script.js"></script>
</body>
</html>
